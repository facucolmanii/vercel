    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.

        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];

      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();

    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

abajo por proyecto<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex; gap:22px; font-size:13.5px\">\n          <a href=\"https://www.linkedin.com/in/facundo-colman-267a91272/\" target=\"_blank\" rel=\"noopener\">LinkedIn<\u002Fa>\n          <a href=\"https://github.com/facucolmanii\" target=\"_blank\" rel=\"noopener\">GitHub<\u002Fa>\n          <a href=\"https://www.instagram.com/colmanfacu/\" target=\"_blank\" rel=\"noopener\">Instagram<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"position:relative; width:100%; max-width:260px; justify-self:end; aspect-ratio:1; background:repeating-linear-gradient(135deg,#0F2C44 0 8px,#12334e 8px 16px); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px\">\n        <svg width=\"72\" height=\"72\" sc-camel-view-box=\"0 0 1080 1080\" style=\"display:block; opacity:0.5\">\n          <g fill=\"#F2F4F6\">\n            <rect x=\"252.3\" y=\"340.2\" width=\"81.1\" height=\"399.6\" rx=\"40.6\"><\u002Frect>\n            <rect x=\"252.3\" y=\"340.2\" width=\"243\" height=\"81.1\" rx=\"40.6\"><\u002Frect>\n            <rect x=\"252.3\" y=\"524\" width=\"179.8\" height=\"81.1\" rx=\"40.6\"><\u002Frect>\n          <\u002Fg>\n          <path d=\"M 874.5 668.4 A 199.8 199.8 0 1 1 874.5 411.6\" fill=\"none\" stroke=\"#F2F4F6\" stroke-width=\"81.1\" stroke-linecap=\"round\"><\u002Fpath>\n        <\u002Fsvg>\n       <img src=\"foto.jpeg\" alt=\"Facundo Colman\" style=\"position:absolute; inset:0; width:100%; height:100%; object-fit:cover\"> <span style=\"font-family:ui-monospace,Menlo,monospace; font-size:11px; color:#7d93a8; letter-spacing:0.04em\">foto.jpeg<\u002Fspan><span style=\"position:absolute; left:0; bottom:-26px; font-family:ui-monospace,Menlo,monospace; font-size:11px; color:#7d93a8\">facundo-colman.vercel.app<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(min(160px,100%),1fr)); gap:14px; margin-top:clamp(36px,6vh,64px)\">\n      <div style=\"background:#0F2C44; padding:24px\">\n        <div data-count=\"5\" data-suffix=\"+\" style=\"font-family:'Archivo Black',sans-serif; font-size:34px; letter-spacing:-0.04em\">5+<\u002Fdiv>\n        <div style=\"font-size:13.5px; color:#8fa3b5; margin-top:6px; line-height:1.4\">años en tecnología<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#0F2C44; padding:24px\">\n        <div data-count=\"3\" data-suffix=\"\" style=\"font-family:'Archivo Black',sans-serif; font-size:34px; letter-spacing:-0.04em\">3<\u002Fdiv>\n        <div style=\"font-size:13.5px; color:#8fa3b5; margin-top:6px; line-height:1.4\">liderando áreas de TI<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#0F2C44; padding:24px\">\n        <div data-count=\"9\" data-suffix=\"\" style=\"font-family:'Archivo Black',sans-serif; font-size:34px; letter-spacing:-0.04em\">9<\u002Fdiv>\n        <div style=\"font-size:13.5px; color:#8fa3b5; margin-top:6px; line-height:1.4\">sedes sostenidas a la vez<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#0F2C44; padding:24px\">\n        <div data-count=\"65\" data-suffix=\"\" style=\"font-family:'Archivo Black',sans-serif; font-size:34px; letter-spacing:-0.04em\">65<\u002Fdiv>\n        <div style=\"font-size:13.5px; color:#8fa3b5; margin-top:6px; line-height:1.4\">usuarios a cargo<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv><\u002Fdiv>\n\n  <section id=\"perfil\" style=\"padding:clamp(64px,10vh,104px) 0; margin-top:clamp(56px,8vh,88px); background:#0F2C44\">\n    <div style=\"max-width:1240px; margin:0 auto; padding:0 max(24px,6vw)\">\n      <div style=\"display:flex; flex-direction:column; gap:16px; margin-bottom:44px\">\n        <div style=\"display:flex; align-items:center; gap:14px\"><span style=\"font-family:ui-monospace,Menlo,monospace; font-size:12px; color:#7d93a8\">01<\u002Fspan><span style=\"display:block; width:26px; height:1px; background:#2a4b64\"><\u002Fspan><span style=\"font-family:'Archivo Black',sans-serif; font-size:13px; letter-spacing:0.1em; color:#3FC8D8\">PERFIL<\u002Fspan><\u002Fdiv>\n        <h2 style=\"font-size:clamp(28px,3.6vw,42px)\">Quién soy y cómo trabajo<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr)); gap:clamp(32px,4vw,56px); align-items:start\">\n        <div style=\"display:flex; flex-direction:column; gap:20px; font-size:17.5px; line-height:1.7; color:#cfd8e0\">\n          <p style=\"font-size:20px; color:#F2F4F6; line-height:1.6\">Soy analista de sistemas con más de cinco años en tecnología, los últimos tres liderando áreas de TI como <strong style=\"font-weight:600; color:#F2F4F6\">responsable único<\u002Fstrong>: primero en una operación distribuida en nueve localidades del país, y hoy en una empresa sujeta a regulación estatal, reportando directamente a dirección.<\u002Fp>\n          <p>Mi trabajo suele empezar en el mismo lugar. Un área de TI que funciona por costumbre, sin registro ni procedimiento, donde nadie sabe cuánto trabajo hay ni dónde están los riesgos. Lo que hago es convertir eso en algo <strong style=\"font-weight:600; color:#F2F4F6\">documentado, auditable y medible<\u002Fstrong>: procesos aprobados dentro del sistema de calidad, indicadores de servicio, matriz de accesos y planes de contingencia.<\u002Fp>\n          <p style=\"font-family:'Archivo Black',sans-serif; font-size:clamp(22px,2.4vw,30px); line-height:1.25; color:#F2F4F6; letter-spacing:-0.02em; border-left:4px solid #3FC8D8; padding-left:24px; margin:14px 0\">La tecnología deja de ser una herramienta suelta y pasa a estar gobernada.<\u002Fp>\n          <p>En lo técnico administro el ERP a nivel funcional, la infraestructura y la seguridad de la información. Cuando comprar una solución no tiene sentido, la desarrollo: mesa de ayuda, tableros comerciales y regulatorios, catálogos sincronizados y automatización de procesos administrativos.<\u002Fp>\n          <p>También me toca la parte menos técnica y no por eso menos importante. Evaluar propuestas de proveedores con números sobre la mesa, negociar alcances y niveles de servicio, capacitar usuarios y explicarle a la dirección qué pasa con la tecnología. Me interesa el cruce entre <strong style=\"font-weight:600; color:#F2F4F6\">sistemas, procesos y normativa<\u002Fstrong>.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#0B1F33; padding:30px; display:flex; flex-direction:column; gap:20px\">\n          <div style=\"font-family:'Archivo Black',sans-serif; font-size:19px; line-height:1.3; color:#F2F4F6; padding-bottom:18px; border-bottom:1px solid #1c3b53\">Ficha<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column\">\n            <div style=\"padding:11px 0; border-bottom:1px solid #1c3b53\">\n              <div style=\"font-size:11.5px; letter-spacing:0.06em; color:#7d93a8; text-transform:uppercase; margin-bottom:4px\">Rol actual<\u002Fdiv>\n              <div style=\"font-size:15.5px; line-height:1.45\">Responsable de TI · Camping 44 S.A.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding:11px 0; border-bottom:1px solid #1c3b53\">\n              <div style=\"font-size:11.5px; letter-spacing:0.06em; color:#7d93a8; text-transform:uppercase; margin-bottom:4px\">Base<\u002Fdiv>\n              <div style=\"font-size:15.5px; line-height:1.45\">Asunción, Paraguay<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding:11px 0; border-bottom:1px solid #1c3b53\">\n              <div style=\"font-size:11.5px; letter-spacing:0.06em; color:#7d93a8; text-transform:uppercase; margin-bottom:4px\">Foco<\u002Fdiv>\n              <div style=\"font-size:15.5px; line-height:1.45\">Gobierno de TI, seguridad, Odoo y automatización<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding:11px 0\">\n              <div style=\"font-size:11.5px; letter-spacing:0.06em; color:#7d93a8; text-transform:uppercase; margin-bottom:4px\">Idiomas<\u002Fdiv>\n              <div style=\"font-size:15.5px; line-height:1.45\">Español nativo · Guaraní e inglés intermedio<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"servicios\" style=\"padding:clamp(64px,10vh,104px) 0\">\n    <div style=\"max-width:1240px; margin:0 auto; padding:0 max(24px,6vw)\">\n      <div style=\"display:flex; flex-direction:column; gap:16px; margin-bottom:44px; max-width:70ch\">\n        <div style=\"display:flex; align-items:center; gap:14px\"><span style=\"font-family:ui-monospace,Menlo,monospace; font-size:12px; color:#7d93a8\">02<\u002Fspan><span style=\"display:block; width:26px; height:1px; background:#2a4b64\"><\u002Fspan><span style=\"font-family:'Archivo Black',sans-serif; font-size:13px; letter-spacing:0.1em; color:#3FC8D8\">SERVICIOS<\u002Fspan><\u002Fdiv>\n        <h2 style=\"font-size:clamp(28px,3.6vw,42px)\">Tres formas de empezar<\u002Fh2>\n        <p style=\"font-size:18px; line-height:1.55; color:#8fa3b5\">Trabajo por proyecto, con alcance escrito y documentación e instructivos incluidos en cada entrega. Todo lo que dejo instalado queda funcionando sin mí.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(min(270px,100%),1fr)); gap:16px\">\n        <div style=\"background:#0F2C44; padding:32px; display:flex; flex-direction:column; gap:18px; border-top:2px solid transparent; transition:transform .2s ease, border-color .2s ease\" data-tilt=\"\" style-hover=\"border-top-color:#3FC8D8\">\n          <div style=\"display:flex; justify-content:space-between; align-items:baseline; gap:12px\">\n            <span style=\"font-family:'Archivo Black',sans-serif; font-size:13px; letter-spacing:0.1em; color:#7d93a8\">PAQUETE 01<\u002Fspan>\n            <sc-if value=\"{{ dest1 }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:12px; color:#0B1F33; background:#3FC8D8; padding:4px 10px; font-weight:500\">Más pedido<\u002Fspan><\u002Fsc-if>\n          <\u002Fdiv>\n          <h3 style=\"font-size:24px\">Automatización en Odoo<\u002Fh3>\n          <p style=\"font-size:15.5px; line-height:1.6; color:#cfd8e0\">Ordeno el ERP y le saco el trabajo manual de encima.<\u002Fp>\n          <div style=\"display:flex; flex-direction:column; gap:10px; font-size:15px; line-height:1.45; color:#8fa3b5\">\n            <div style=\"display:flex; gap:12px\"><span>—<\u002Fspan><span>Reglas y flujos automáticos<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex; gap:12px\"><span>—<\u002Fspan><span>Personalizaciones en Studio y reportes QWeb<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex; gap:12px\"><span>—<\u002Fspan><span>Integraciones por API con tus otras apps<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex; gap:12px\"><span>—<\u002Fspan><span>Auditoría de esquema antes de migrar versión<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:auto; padding-top:18px; border-top:1px solid #1c3b53; font-size:14px; color:#8fa3b5\">Se cotiza por hora en USD, según el alcance que necesites.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#0F2C44; padding:32px; display:flex; flex-direction:column; gap:18px; border-top:2px solid transparent; transition:transform .2s ease, border-color .2s ease\" data-tilt=\"\" style-hover=\"border-top-color:#3FC8D8\">\n          <div style=\"display:flex; justify-content:space-between; align-items:baseline; gap:12px\">\n            <span style=\"font-family:'Archivo Black',sans-serif; font-size:13px; letter-spacing:0.1em; color:#7d93a8\">PAQUETE 02<\u002Fspan>\n            <sc-if value=\"{{ dest2 }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:12px; color:#0B1F33; background:#3FC8D8; padding:4px 10px; font-weight:500\">Más pedido<\u002Fspan><\u002Fsc-if>\n          <\u002Fdiv>\n          <h3 style=\"font-size:24px\">Sistemas internos en Google Workspace<\u002Fh3>\n          <p style=\"font-size:15.5px; line-height:1.6; color:#cfd8e0\">Lo que hoy vive en planillas y WhatsApp, con circuito propio.<\u002Fp>\n          <div style=\"display:flex; flex-direction:column; gap:10px; font-size:15px; line-height:1.45; color:#8fa3b5\">\n            <div style=\"display:flex; gap:12px\"><span>—<\u002Fspan><span>Mesa de ayuda con SLA e indicadores<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex; gap:12px\"><span>—<\u002Fspan><span>Formularios con QR y firma<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex; gap:12px\"><span>—<\u002Fspan><span>Tableros de gestión por área<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex; gap:12px\"><span>—<\u002Fspan><span>Sin licencias nuevas: sobre lo que ya pagás<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:auto; padding-top:18px; border-top:1px solid #1c3b53; font-size:14px; color:#8fa3b5\">Se cotiza por hora en USD, según el alcance que necesites.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#0F2C44; padding:32px; display:flex; flex-direction:column; gap:18px; border-top:2px solid transparent; transition:transform .2s ease, border-color .2s ease\" data-tilt=\"\" style-hover=\"border-top-color:#3FC8D8\">\n          <div style=\"display:flex; justify-content:space-between; align-items:baseline; gap:12px\">\n            <span style=\"font-family:'Archivo Black',sans-serif; font-size:13px; letter-spacing:0.1em; color:#7d93a8\">PAQUETE 03<\u002Fspan>\n            <sc-if value=\"{{ dest3 }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:12px; color:#0B1F33; background:#3FC8D8; padding:4px 10px; font-weight:500\">Más pedido<\u002Fspan><\u002Fsc-if>\n          <\u002Fdiv>\n          <h3 style=\"font-size:24px\">Reportes que se actualizan solos<\u002Fh3>\n          <p style=\"font-size:15.5px; line-height:1.6; color:#cfd8e0\">Indicadores al día sin que nadie los cargue a mano.<\u002Fp>\n          <div style=\"display:flex; flex-direction:column; gap:10px; font-size:15px; line-height:1.45; color:#8fa3b5\">\n            <div style=\"display:flex; gap:12px\"><span>—<\u002Fspan><span>Tableros comerciales y regulatorios<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex; gap:12px\"><span>—<\u002Fspan><span>Datos tomados del ERP, sin carga manual<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex; gap:12px\"><span>—<\u002Fspan><span>Proyecciones, ranking y KPIs<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex; gap:12px\"><span>—<\u002Fspan><span>Instructivos de uso para el equipo<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:auto; padding-top:18px; border-top:1px solid #1c3b53; font-size:14px; color:#8fa3b5\">Se cotiza por hora en USD, según el alcance que necesites.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top:24px; background:#0F2C44; padding:28px 32px; display:flex; justify-content:space-between; align-items:center; gap:24px; flex-wrap:wrap\">\n        <div style=\"display:flex; flex-direction:column; gap:6px\">\n          <span style=\"font-family:'Archivo Black',sans-serif; font-size:19px\">¿No sabés por dónde arrancar?<\u002Fspan>\n          <span style=\"font-size:15px; color:#8fa3b5\">Diagnóstico de 30 minutos: te digo qué automatizar primero y qué conviene dejar como está.<\u002Fspan>\n        <\u002Fdiv>\n        <a data-wa=\"\" href=\"{{ waLink }}\" target=\"_blank\" rel=\"noopener\" style=\"position:relative; overflow:hidden; background:#3FC8D8; color:#0B1F33; font-weight:500; font-size:15px; padding:15px 26px; white-space:nowrap\">Agendar por WhatsApp<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"metodo\" style=\"padding:clamp(64px,10vh,104px) 0; background:#0F2C44\">\n    <div style=\"max-width:1240px; margin:0 auto; padding:0 max(24px,6vw)\">\n      <div style=\"display:flex; flex-direction:column; gap:16px; margin-bottom:44px; max-width:70ch\">\n        <div style=\"display:flex; align-items:center; gap:14px\"><span style=\"font-family:ui-monospace,Menlo,monospace; font-size:12px; color:#7d93a8\">03<\u002Fspan><span style=\"display:block; width:26px; height:1px; background:#2a4b64\"><\u002Fspan><span style=\"font-family:'Archivo Black',sans-serif; font-size:13px; letter-spacing:0.1em; color:#3FC8D8\">MÉTODO<\u002Fspan><\u002Fdiv>\n        <h2 style=\"font-size:clamp(28px,3.6vw,42px)\">Cómo trabajo cuando tomo un área<\u002Fh2>\n        <p style=\"font-size:18px; line-height:1.55; color:#8fa3b5\">Los mismos cuatro pasos, siempre. El orden importa: medir antes de entender produce números que nadie cree.<\u002Fp>\n      <\u002Fdiv>\n      <div data-method-track=\"\" style=\"height:2px; background:#234459; margin-bottom:18px\"><div data-method-fill=\"\" style=\"height:100%; width:0; background:#3FC8D8\"><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr)); gap:16px\">\n        <div data-step=\"1\" style=\"background:#0B1F33; padding:28px; display:flex; flex-direction:column; gap:12px\">\n          <div style=\"font-family:'Archivo Black',sans-serif; font-size:15px; color:#3FC8D8; letter-spacing:0.04em\">1 · ENTENDER<\u002Fdiv>\n          <p style=\"font-size:15.5px; line-height:1.6; color:#cfd8e0\">Antes de tocar nada relevo lo que hay: sistemas, accesos, contratos, proveedores y quién depende de qué. La mayor parte del riesgo está en lo que nadie escribió.<\u002Fp>\n        <\u002Fdiv>\n        <div data-step=\"2\" style=\"background:#0B1F33; padding:28px; display:flex; flex-direction:column; gap:12px\">\n          <div style=\"font-family:'Archivo Black',sans-serif; font-size:15px; color:#7d93a8; letter-spacing:0.04em\">2 · DOCUMENTAR<\u002Fdiv>\n          <p style=\"font-size:15.5px; line-height:1.6; color:#cfd8e0\">Convierto la costumbre en procedimiento: procesos escritos, formularios de registro y aprobación dentro del sistema de calidad. Lo que no está escrito no existe ni se puede auditar.<\u002Fp>\n        <\u002Fdiv>\n        <div data-step=\"3\" style=\"background:#0B1F33; padding:28px; display:flex; flex-direction:column; gap:12px\">\n          <div style=\"font-family:'Archivo Black',sans-serif; font-size:15px; color:#7d93a8; letter-spacing:0.04em\">3 · MEDIR<\u002Fdiv>\n          <p style=\"font-size:15.5px; line-height:1.6; color:#cfd8e0\">Instalo indicadores que reflejen la realidad: tiempos de respuesta, cumplimiento de SLA y carga por área. Sin medición, el área se discute por impresiones.<\u002Fp>\n        <\u002Fdiv>\n        <div data-step=\"4\" style=\"background:#0B1F33; padding:28px; display:flex; flex-direction:column; gap:12px\">\n          <div style=\"font-family:'Archivo Black',sans-serif; font-size:15px; color:#7d93a8; letter-spacing:0.04em\">4 · MEJORAR<\u002Fdiv>\n          <p style=\"font-size:15.5px; line-height:1.6; color:#cfd8e0\">Con datos sobre la mesa priorizo: automatizo lo que se repite, negocio lo que cuesta de más y reporto a la dirección en términos de negocio, no técnicos.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr)); gap:16px; margin-top:16px\">\n        <div style=\"border-top:3px solid #234459; padding-top:16px\">\n          <div style=\"font-family:'Archivo Black',sans-serif; font-size:17px; margin-bottom:8px\">Gobierno<\u002Fdiv>\n          <p style=\"font-size:15px; line-height:1.55; color:#8fa3b5\">Plan anual con metas medibles, indicadores de servicio, documentación de procesos y reporte periódico a dirección.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border-top:3px solid #234459; padding-top:16px\">\n          <div style=\"font-family:'Archivo Black',sans-serif; font-size:17px; margin-bottom:8px\">Seguridad<\u002Fdiv>\n          <p style=\"font-size:15px; line-height:1.55; color:#8fa3b5\">Procesos escritos y aprobados dentro del sistema de calidad, con registro auditable y planes de continuidad.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border-top:3px solid #234459; padding-top:16px\">\n          <div style=\"font-family:'Archivo Black',sans-serif; font-size:17px; margin-bottom:8px\">Sistemas<\u002Fdiv>\n          <p style=\"font-size:15px; line-height:1.55; color:#8fa3b5\">ERP a nivel funcional, infraestructura, conectividad y continuidad operativa en entornos distribuidos.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border-top:3px solid #234459; padding-top:16px\">\n          <div style=\"font-family:'Archivo Black',sans-serif; font-size:17px; margin-bottom:8px\">Desarrollo<\u002Fdiv>\n          <p style=\"font-size:15px; line-height:1.55; color:#8fa3b5\">Herramientas internas cuando comprarlas no conviene: tableros, automatizaciones e integraciones.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"casos\" style=\"padding:clamp(64px,10vh,104px) 0\">\n    <div style=\"max-width:1240px; margin:0 auto; padding:0 max(24px,6vw)\">\n      <div style=\"display:flex; flex-direction:column; gap:16px; margin-bottom:44px; max-width:70ch\">\n        <div style=\"display:flex; align-items:center; gap:14px\"><span style=\"font-family:ui-monospace,Menlo,monospace; font-size:12px; color:#7d93a8\">04<\u002Fspan><span style=\"display:block; width:26px; height:1px; background:#2a4b64\"><\u002Fspan><span style=\"font-family:'Archivo Black',sans-serif; font-size:13px; letter-spacing:0.1em; color:#3FC8D8\">CASOS<\u002Fspan><\u002Fdiv>\n        <h2 style=\"font-size:clamp(28px,3.6vw,42px)\">Qué dejé instalado<\u002Fh2>\n        <p style=\"font-size:18px; line-height:1.55; color:#8fa3b5\">Seis frentes que abrí como responsable único del área. En cada uno la situación de partida era la misma: sin registro, sin procedimiento y sin forma de saber dónde estaban los riesgos.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex; flex-direction:column; gap:16px\">\n        <article style=\"background:#0F2C44; padding:32px; display:grid; grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr)); gap:clamp(18px,2.5vw,32px); border-top:2px solid transparent; transition:transform .2s ease, border-color .2s ease\" data-tilt=\"\" style-hover=\"border-top-color:#3FC8D8\">\n          <div style=\"display:flex; flex-direction:column; gap:10px\">\n            <h3 style=\"font-size:22px; line-height:1.15\">El área pasa a tener un plan<\u002Fh3>\n            <p style=\"font-size:14px; color:#7d93a8; line-height:1.45\">Camping 44 S.A. · 49 usuarios · reporte a la Gerencia de Administración y Finanzas<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:16px\">\n            <p style=\"font-size:16.5px; line-height:1.65; color:#cfd8e0\">Definí la estrategia anual desde cero: análisis FODA, cinco ejes con metas trimestrales medibles y revisión periódica ante la gerencia. Fue el primer plan formal que tuvo TI en la empresa. Con él, el área dejó de discutirse por urgencias y pasó a tener prioridades acordadas y verificables.<\u002Fp>\n            <div style=\"display:flex; flex-wrap:wrap; gap:8px; font-size:12.5px; color:#8fa3b5\">\n              <span style=\"background:#0B1F33; padding:6px 12px\">Planificación estratégica<\u002Fspan>\n              <span style=\"background:#0B1F33; padding:6px 12px\">Metas trimestrales<\u002Fspan>\n              <span style=\"background:#0B1F33; padding:6px 12px\">Reporte a dirección<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Farticle>\n        <article style=\"background:#0F2C44; padding:32px; display:grid; grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr)); gap:clamp(18px,2.5vw,32px); border-top:2px solid transparent; transition:transform .2s ease, border-color .2s ease\" data-tilt=\"\" style-hover=\"border-top-color:#3FC8D8\">\n          <div style=\"display:flex; flex-direction:column; gap:10px\">\n            <h3 style=\"font-size:22px; line-height:1.15\">La seguridad deja de ser criterio personal<\u002Fh3>\n            <p style=\"font-size:14px; color:#7d93a8; line-height:1.45\">Camping 44 S.A. · proceso aprobado e incorporado al Sistema de Gestión de Calidad<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:16px\">\n            <p style=\"font-size:16.5px; line-height:1.65; color:#cfd8e0\">Escribí el proceso de seguridad informática del área y logré su aprobación e incorporación al sistema de calidad, con formularios de registro que le dan evidencia auditable. La seguridad dejó de depender de que alguien se acuerde y pasó a ser un procedimiento con trazabilidad.<\u002Fp>\n            <div style=\"display:flex; flex-wrap:wrap; gap:8px; font-size:12.5px; color:#8fa3b5\">\n              <span style=\"background:#0B1F33; padding:6px 12px\">Proceso aprobado<\u002Fspan>\n              <span style=\"background:#0B1F33; padding:6px 12px\">Evidencia auditable<\u002Fspan>\n              <span style=\"background:#0B1F33; padding:6px 12px\">Sistema de calidad<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Farticle>\n        <article style=\"background:#0F2C44; padding:32px; display:grid; grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr)); gap:clamp(18px,2.5vw,32px); border-top:2px solid transparent; transition:transform .2s ease, border-color .2s ease\" data-tilt=\"\" style-hover=\"border-top-color:#3FC8D8\">\n          <div style=\"display:flex; flex-direction:column; gap:10px\">\n            <h3 style=\"font-size:22px; line-height:1.15\">Lo que no se registraba, ahora se mide<\u002Fh3>\n            <p style=\"font-size:14px; color:#7d93a8; line-height:1.45\">Camping 44 S.A. · mesa de ayuda construida internamente, no contratada<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:16px\">\n            <p style=\"font-size:16.5px; line-height:1.65; color:#cfd8e0\">Construí la mesa de ayuda en lugar de comprarla. Con ella empecé a medir lo que antes no se registraba en ningún lado: tiempos de resolución, cumplimiento de SLA y distribución de la carga por área. Esos indicadores son hoy la base del reporte a dirección y la única evidencia objetiva del volumen real de trabajo del área.<\u002Fp>\n            <div style=\"display:flex; flex-wrap:wrap; gap:8px; font-size:12.5px; color:#8fa3b5\">\n              <span style=\"background:#0B1F33; padding:6px 12px\">SLA<\u002Fspan>\n              <span style=\"background:#0B1F33; padding:6px 12px\">Gestión de incidentes<\u002Fspan>\n              <span style=\"background:#0B1F33; padding:6px 12px\">Indicadores de servicio<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Farticle>\n        <article style=\"background:#0F2C44; padding:32px; display:grid; grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr)); gap:clamp(18px,2.5vw,32px); border-top:2px solid transparent; transition:transform .2s ease, border-color .2s ease\" data-tilt=\"\" style-hover=\"border-top-color:#3FC8D8\">\n          <div style=\"display:flex; flex-direction:column; gap:10px\">\n            <h3 style=\"font-size:22px; line-height:1.15\">Odoo bajo control antes de migrar<\u002Fh3>\n            <p style=\"font-size:14px; color:#7d93a8; line-height:1.45\">Camping 44 S.A. · administración funcional y control de deuda técnica<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:16px\">\n            <p style=\"font-size:16.5px; line-height:1.65; color:#cfd8e0\">Llevo la administración funcional completa del ERP: configuraciones, personalizaciones en Studio, reportes QWeb y pruebas de aceptación antes de cada liberación. Desarrollé además una herramienta que compara el estado del ERP contra una línea base y detecta campos nuevos, huérfanos y referencias rotas, para medir la deuda técnica antes del cambio de versión en lugar de descubrirla durante la migración.<\u002Fp>\n            <div style=\"display:flex; flex-wrap:wrap; gap:8px; font-size:12.5px; color:#8fa3b5\">\n              <span style=\"background:#0B1F33; padding:6px 12px\">Odoo<\u002Fspan>\n              <span style=\"background:#0B1F33; padding:6px 12px\">Studio<\u002Fspan>\n              <span style=\"background:#0B1F33; padding:6px 12px\">QWeb<\u002Fspan>\n              <span style=\"background:#0B1F33; padding:6px 12px\">Auditoría de esquema<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Farticle>\n        <article style=\"background:#0F2C44; padding:32px; display:grid; grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr)); gap:clamp(18px,2.5vw,32px); border-top:2px solid transparent; transition:transform .2s ease, border-color .2s ease\" data-tilt=\"\" style-hover=\"border-top-color:#3FC8D8\">\n          <div style=\"display:flex; flex-direction:column; gap:10px\">\n            <h3 style=\"font-size:22px; line-height:1.15\">Nueve sedes sostenidas por una persona<\u002Fh3>\n            <p style=\"font-size:14px; color:#7d93a8; line-height:1.45\">H3 Agrochemicals S.A. · casa matriz, oficina corporativa y siete sucursales<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:16px\">\n            <p style=\"font-size:16.5px; line-height:1.65; color:#cfd8e0\">Durante casi tres años cubrí solo la operación tecnológica de una empresa distribuida en nueve localidades: sistemas, conectividad, servidor central, accesos y respaldos, resolviendo en remoto con usuarios no técnicos a cientos de kilómetros. Ordené además el parque tecnológico completo, desde el inventario de hardware y licencias hasta la contratación y supervisión de los servicios de mantenimiento.<\u002Fp>\n            <div style=\"display:flex; flex-wrap:wrap; gap:8px; font-size:12.5px; color:#8fa3b5\">\n              <span style=\"background:#0B1F33; padding:6px 12px\">Operación distribuida<\u002Fspan>\n              <span style=\"background:#0B1F33; padding:6px 12px\">Soporte remoto<\u002Fspan>\n              <span style=\"background:#0B1F33; padding:6px 12px\">Inventario de activos<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Farticle>\n        <article style=\"background:#0F2C44; padding:32px; display:grid; grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr)); gap:clamp(18px,2.5vw,32px); border-top:2px solid transparent; transition:transform .2s ease, border-color .2s ease\" data-tilt=\"\" style-hover=\"border-top-color:#3FC8D8\">\n          <div style=\"display:flex; flex-direction:column; gap:10px\">\n            <h3 style=\"font-size:22px; line-height:1.15\">Pérdida de datos en un ERP heredado<\u002Fh3>\n            <p style=\"font-size:14px; color:#7d93a8; line-height:1.45\">Camping 44 S.A. · incidente crítico con intervención forense externa<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:16px\">\n            <p style=\"font-size:16.5px; line-height:1.65; color:#cfd8e0\">Coordiné la intervención de un laboratorio forense externo, documenté el diagnóstico y definí el alcance de la reconstrucción. Lo importante del caso no fue solo resolverlo: fue que la conclusión quedara escrita y trazable, y no en la memoria de una persona.<\u002Fp>\n            <div style=\"display:flex; flex-wrap:wrap; gap:8px; font-size:12.5px; color:#8fa3b5\">\n              <span style=\"background:#0B1F33; padding:6px 12px\">Gestión de incidentes<\u002Fspan>\n              <span style=\"background:#0B1F33; padding:6px 12px\">Forense<\u002Fspan>\n              <span style=\"background:#0B1F33; padding:6px 12px\">Continuidad<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Farticle>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"desarrollos\" style=\"padding:clamp(64px,10vh,104px) 0; background:#0F2C44\">\n    <div style=\"max-width:1240px; margin:0 auto; padding:0 max(24px,6vw)\">\n      <div style=\"display:flex; flex-direction:column; gap:16px; margin-bottom:44px; max-width:70ch\">\n        <div style=\"display:flex; align-items:center; gap:14px\"><span style=\"font-family:ui-monospace,Menlo,monospace; font-size:12px; color:#7d93a8\">05<\u002Fspan><span style=\"display:block; width:26px; height:1px; background:#2a4b64\"><\u002Fspan><span style=\"font-family:'Archivo Black',sans-serif; font-size:13px; letter-spacing:0.1em; color:#3FC8D8\">DESARROLLOS<\u002Fspan><\u002Fdiv>\n        <h2 style=\"font-size:clamp(28px,3.6vw,42px)\">Herramientas que construí<\u002Fh2>\n        <p style=\"font-size:18px; line-height:1.55; color:#8fa3b5\">Sistemas internos que desarrollé cuando comprarlos no tenía sentido. No hay capturas: los sistemas reales contienen datos de empresas y clientes.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(min(270px,100%),1fr)); gap:16px\">\n        <div style=\"background:#0B1F33; padding:28px; display:flex; flex-direction:column; gap:12px; border-top:2px solid transparent; transition:transform .2s ease, border-color .2s ease\" data-tilt=\"\" style-hover=\"border-top-color:#3FC8D8\">\n          <h3 style=\"font-size:19px\">BI comercial<\u002Fh3>\n          <p style=\"font-size:15.5px; line-height:1.6; color:#cfd8e0\">Seguimiento del objetivo comercial anual sobre cinco canales y veinte vendedores: avance diario, proyección de cierre, contribución por canal, ranking y KPIs de bonos, con carga y archivado de metas mensuales.<\u002Fp>\n          <div style=\"font-size:12.5px; color:#7d93a8; margin-top:auto; padding-top:12px\">Apps Script · Sheets · ERP<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#0B1F33; padding:28px; display:flex; flex-direction:column; gap:12px; border-top:2px solid transparent; transition:transform .2s ease, border-color .2s ease\" data-tilt=\"\" style-hover=\"border-top-color:#3FC8D8\">\n          <h3 style=\"font-size:19px\">Panel de gestión regulatoria<\u002Fh3>\n          <p style=\"font-size:15.5px; line-height:1.6; color:#cfd8e0\">Control de la cartera de clientes regulados: segmentación por tipo de gestión, antigüedad de pendientes, renovación de habilitaciones y auditoría automática contra la base de origen.<\u002Fp>\n          <div style=\"font-size:12.5px; color:#7d93a8; margin-top:auto; padding-top:12px\">Apps Script · Odoo<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#0B1F33; padding:28px; display:flex; flex-direction:column; gap:12px; border-top:2px solid transparent; transition:transform .2s ease, border-color .2s ease\" data-tilt=\"\" style-hover=\"border-top-color:#3FC8D8\">\n          <h3 style=\"font-size:19px\">Catálogos digitales<\u002Fh3>\n          <p style=\"font-size:15.5px; line-height:1.6; color:#cfd8e0\">Catálogo mayorista y de salón sincronizados con el ERP: más de 3.500 productos, múltiples listas de precios, stock en vivo y generación de cotizaciones en PDF.<\u002Fp>\n          <div style=\"font-size:12.5px; color:#7d93a8; margin-top:auto; padding-top:12px\">Odoo · Web<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#0B1F33; padding:28px; display:flex; flex-direction:column; gap:12px; border-top:2px solid transparent; transition:transform .2s ease, border-color .2s ease\" data-tilt=\"\" style-hover=\"border-top-color:#3FC8D8\">\n          <h3 style=\"font-size:19px\">Mesa de ayuda<\u002Fh3>\n          <p style=\"font-size:15.5px; line-height:1.6; color:#cfd8e0\">Aplicación web integrada al correo corporativo: clasificación y priorización de tickets, tiempos de resolución, control de SLA e indicadores. Circuito equivalente para pedidos a logística.<\u002Fp>\n          <div style=\"font-size:12.5px; color:#7d93a8; margin-top:auto; padding-top:12px\">Apps Script · Gmail · Sheets<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#0B1F33; padding:28px; display:flex; flex-direction:column; gap:12px; border-top:2px solid transparent; transition:transform .2s ease, border-color .2s ease\" data-tilt=\"\" style-hover=\"border-top-color:#3FC8D8\">\n          <h3 style=\"font-size:19px\">Liquidación de salarios<\u002Fh3>\n          <p style=\"font-size:15.5px; line-height:1.6; color:#cfd8e0\">Integración del ERP con las planillas corporativas: cruce de novedades por cédula, cálculo de aportes, recibos en PDF y generación del archivo oficial del Ministerio de Trabajo sin cruces manuales.<\u002Fp>\n          <div style=\"font-size:12.5px; color:#7d93a8; margin-top:auto; padding-top:12px\">Odoo · Apps Script<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#0B1F33; padding:28px; display:flex; flex-direction:column; gap:12px; border-top:2px solid transparent; transition:transform .2s ease, border-color .2s ease\" data-tilt=\"\" style-hover=\"border-top-color:#3FC8D8\">\n          <h3 style=\"font-size:19px\">Auditoría de ERP<\u002Fh3>\n          <p style=\"font-size:15.5px; line-height:1.6; color:#cfd8e0\">Comparación del esquema del ERP contra una línea base para detectar campos nuevos, huérfanos y referencias rotas, y dimensionar la deuda técnica antes de una migración de versión.<\u002Fp>\n          <div style=\"font-size:12.5px; color:#7d93a8; margin-top:auto; padding-top:12px\">Python · Odoo<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"experiencia\" style=\"padding:clamp(64px,10vh,104px) 0\">\n    <div style=\"max-width:1240px; margin:0 auto; padding:0 max(24px,6vw)\">\n      <div style=\"display:flex; flex-direction:column; gap:16px; margin-bottom:44px\">\n        <div style=\"display:flex; align-items:center; gap:14px\"><span style=\"font-family:ui-monospace,Menlo,monospace; font-
